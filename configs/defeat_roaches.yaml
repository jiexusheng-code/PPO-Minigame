# DefeatRoaches 正式训练配置（基线）：持续训练，人工中断（total_timesteps: -1）。
# 用法: TRAIN_CONFIG_PATH=configs/defeat_roaches.yaml python train.py
# 启动前: python tools/bitahub_preflight.py --config configs/defeat_roaches.yaml
#
# 地图特性：4 个陆战队员 vs 蟑螂，回合在全员阵亡或清场时结束；step_mul=8 时随机策略
# 约 50~100 步即全灭，学会交战后会拉长到 240 步上限（120s 游戏时间）。
# 实测（16 envs / subproc / RTX 4090，关闭评估）：约 235 env-steps/s，随机策略 ep_rew_mean≈8。
# 这是三张图里唯一有即时奖励信号（击杀）的地图，适合作为新地图的第一条基线。

env: DefeatRoaches
out_dir: ./models/defeat_roaches
checkpoint_path:

n_envs: 16
seed: 0
device: auto             # CUDA 可用时使用 GPU，否则回退 CPU；也可写 cpu / cuda / cuda:0
vec_env_cls: subproc     # 必填，无代码默认值：dummy 单进程串行 / subproc 多进程并行

policy: MaskedFlattenPolicy
policy_kwargs:
  features_extractor_kwargs:
    cnn_output_dim: 256

env_kwargs:
  screen_size: 32
  minimap_size: 32
  step_mul: 8             # 战斗微操保留细粒度：每次决策 8 个游戏步
  visualize: false
  reset_jitter_max_steps: 0  # 抖动只在每个 env 的首次 reset 生效，对训练无收益，直接关闭

# 不固定步数：设置 <=0 表示持续训练，直到手动中断（Ctrl+C / SIGINT）。
# 中断时 train.py 会正常保存 final_model 并关闭所有 SC2 进程。
total_timesteps: -1

# rollout = n_envs * n_steps = 16 * 64 = 1024；batch 256 -> 每个 epoch 4 个 minibatch
learning_rate: 3e-4
ent_coef: 0.001           # 回合短、奖励即时，探索压力小，保持低熵系数
batch_size: 256
n_epochs: 4
gamma: 0.99               # 有效回合 < 240 步，0.99 已覆盖
gae_lambda: 0.95
n_steps: 64               # 512 -> 1024：减少长回合下的 bootstrap 偏差
clip_range: 0.2
vf_coef: 0.5
max_grad_norm: 0.5
clip_value_loss: false

# 1 optimization-step = n_envs * n_steps = 1024 env-steps
save_iters: 500           # 约每 51 万 env-steps 保存一次（单模型约 33MB）
summary_iters: 10
eval_every: 50            # 50 opt-steps = 3200 VecEnv steps = 51200 env-steps
n_eval_episodes: 10       # 单局 60~240 步，10 局评估开销可忽略
eval_deterministic: false
eval_render: false

tensorboard: true
tb_log_dir: tb_logs
log_interval: 1

save_best_model: true     # 发现更优模型时清理周期 checkpoint，只保留最佳/最终模型
verbose: 1
