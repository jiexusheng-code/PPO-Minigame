# BuildMarines 正式训练配置（基线）：持续训练，人工中断（total_timesteps: -1）。
# 用法: TRAIN_CONFIG_PATH=configs/build_marines.yaml python train.py
# 启动前: python tools/bitahub_preflight.py --config configs/build_marines.yaml
#
# 地图特性：地图时间上限 900s；step_mul=8 时实测 episode = 1800 agent steps，
# 本配置改用 step_mul=24 -> 恰为 600 steps/局（14400 game steps）。
# 实测（16 envs / subproc / RTX 4090，关闭评估）：约 255 env-steps/s。
# 奖励 = score 差分（造出的陆战队员）。要拿到第一分需要 补给站 -> 兵营 -> 造兵 的多步序列，
# 随机策略跑完整局 reward 为 0。本轮是基线：超参数只能改善样本效率，无法替代奖励整形
# 或动作子集等工程手段；若数十万步后 ep_rew_mean 仍为 0，再动工程/网络结构。

env: BuildMarines
out_dir: ./models/build_marines
checkpoint_path:

n_envs: 16
seed: 0
device: auto             # CUDA 可用时使用 GPU，否则回退 CPU；也可写 cpu / cuda / cuda:0
vec_env_cls: subproc     # 必填，无代码默认值：dummy 单进程串行 / subproc 多进程并行

policy: MaskedFlattenPolicy
policy_kwargs:
  features_extractor_kwargs:
    cnn_output_dim: 256

env_kwargs:
  screen_size: 32
  minimap_size: 32
  step_mul: 24            # 运营不需要精细操作；回合 1800 -> 600 步
  visualize: false
  reset_jitter_max_steps: 0  # 开局 no_op 对 600 步的运营局是纯浪费

# 不固定步数：设置 <=0 表示持续训练，直到手动中断（Ctrl+C / SIGINT）。
# 中断时 train.py 会正常保存 final_model 并关闭所有 SC2 进程。
total_timesteps: -1

# rollout = n_envs * n_steps = 16 * 64 = 1024；batch 256 -> 每个 epoch 4 个 minibatch
learning_rate: 3e-4
ent_coef: 0.005           # 初始阶段几乎无奖励，略提高熵系数保留探索
batch_size: 256
n_epochs: 4
gamma: 0.997              # 首个奖励在序列深处，尽量拉长折扣视野
gae_lambda: 0.98          # GAE 有效视野约 1/(1-gamma*lambda) ≈ 44 步
n_steps: 64
clip_range: 0.2
vf_coef: 0.5
max_grad_norm: 0.5
clip_value_loss: false

# 1 optimization-step = n_envs * n_steps = 1024 env-steps
save_iters: 500           # 约每 51 万 env-steps 保存一次（单模型约 33MB）
summary_iters: 10
eval_every: 50            # 50 opt-steps = 3200 VecEnv steps = 51200 env-steps
n_eval_episodes: 5        # 单局 600 步；5 局约占采样量 6%
eval_deterministic: false
eval_render: false

tensorboard: true
tb_log_dir: tb_logs
log_interval: 1

save_best_model: true     # 发现更优模型时清理周期 checkpoint，只保留最佳/最终模型
verbose: 1
