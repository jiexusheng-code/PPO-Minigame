# Bitahub 首次云端训练配置：有限步数、保守资源。
# 用法: TRAIN_CONFIG_PATH=configs/bitahub_first_run.yaml python train.py
# 启动前: python tools/bitahub_preflight.py --config configs/bitahub_first_run.yaml

env: MoveToBeacon
out_dir: ./models/bitahub_first_run
checkpoint_path:

n_envs: 8
seed: 0
device: auto             # CUDA 可用时使用 GPU，否则回退 CPU；也可写 cpu / cuda / cuda:0
vec_env_cls: subproc     # 向量化环境类型: "dummy" (单进程串行) 或 "subproc" (多进程并行)

policy: MaskedFlattenPolicy
policy_kwargs:
  features_extractor_kwargs:
    cnn_output_dim: 256

env_kwargs:
  screen_size: 32
  minimap_size: 32
  step_mul: 8
  visualize: false
  reset_jitter_max_steps: 15

# 首次云端实验使用有限步数，避免 total_timesteps=-1 无限训练。
total_timesteps: 1000000

learning_rate: 7e-4
ent_coef: 0.001
batch_size: 128          # 等于 n_envs*n_steps，每个 epoch 恰好一个 minibatch
n_epochs: 4
gamma: 0.99
gae_lambda: 0.95
n_steps: 16
clip_range: 0.2
vf_coef: 0.5
max_grad_norm: 0.5
clip_value_loss: false

save_iters: 500          # 1M 步约 16 次周期保存，减少磁盘占用（约 520MB vs 1.3GB）
summary_iters: 10
eval_every: 200          # 200 opt-steps = 25600 env-steps 评估一次，减少 4 倍评估开销（约 15 分钟 vs 1 小时）
n_eval_episodes: 5       # 单次评估时间减半，保持足够统计性
eval_deterministic: false
eval_render: false

tensorboard: true
tb_log_dir: tb_logs
log_interval: 1

save_best_model: true
verbose: 1
